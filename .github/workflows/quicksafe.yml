name: QuickSafe-oracle v23 - Build and Test QuickSafe
run-name: QuickSafe v23 | ${{ github.event_name }} | ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      vp_targets_str:
        description: "QuickSafe target selector (must match upstream VP_TARGETS_STR syntax); leave blank for baseline tests"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - '.github/workflows/QuickSafe-oracle-v23.yml'

permissions:
  contents: read

concurrency:
  group: quicksafe-oracle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  quicksafe:
    name: Build QuickSafe and run LibCalls on Oracle
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      QS_ROOT: /home/ubuntu/quicksafe-work
      QS_REPO: https://github.com/vusec/QuickSafe.git
      QS_REF: 515453512fc5e9991d5d9f71691a4fecd59f8f4f
      QS_LOGS: /home/ubuntu/quicksafe-work/ci-logs/${{ github.run_id }}-${{ github.run_attempt }}
      QS_VENV: /home/ubuntu/quicksafe-work/venvs/${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONPATH: /home/ubuntu/quicksafe-work/source/quicksafe/infra
      VP_TARGETS_STR: ${{ inputs.vp_targets_str || '' }}
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - name: 01 - Verify runner and initialize isolated diagnostics
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_NAME" == quicksafe ]] || { echo "::error::Expected runner quicksafe; got $RUNNER_NAME"; exit 1; }
          [[ "$(uname -m)" == x86_64 ]] || { echo '::error::x86_64 required'; exit 1; }
          sudo -n true || { echo '::error::Passwordless sudo required'; exit 1; }
          mkdir -p "$QS_ROOT" "$QS_LOGS" "$(dirname "$QS_VENV")"
          echo "Runner: $RUNNER_NAME | Host: $(hostname) | User: $(id -un)"
          echo "Run ID: $GITHUB_RUN_ID | Attempt: $GITHUB_RUN_ATTEMPT"
          uname -a | tee "$QS_LOGS/uname.txt"
          cat /etc/os-release | tee "$QS_LOGS/os-release.txt"
          free -h | tee "$QS_LOGS/memory-before.txt"
          df -h | tee "$QS_LOGS/disk-before.txt"
          swapon --show || true

      - name: 02 - Install native build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential binutils file cmake ninja-build git curl ca-certificates python3 python3-venv \
            python3-dev python3-pip pkg-config clang lld llvm llvm-dev libelf-dev \
            libzstd-dev zlib1g-dev libtinfo-dev libxml2-dev libedit-dev libncurses-dev \
            libunwind-dev libssl-dev ccache autoconf automake libtool bison flex \
            make patch xz-utils wget time
          { cmake --version; clang --version; python3 --version; } | tee "$QS_LOGS/tool-versions.txt"
          llvm-config --version || true

      - name: 03 - Checkout pinned QuickSafe source and submodules
        run: |
          set -Eeuo pipefail
          if [[ ! -d "$QS_ROOT/source/.git" ]]; then
            git clone "$QS_REPO" "$QS_ROOT/source"
          fi
          cd "$QS_ROOT/source"
          git fetch origin "$QS_REF" || git fetch origin
          git checkout --detach "$QS_REF"
          git reset --hard "$QS_REF"
          [[ "$(git rev-parse HEAD)" == "$QS_REF" ]] || { echo '::error::Wrong source revision'; exit 1; }
          git -c url.https://github.com/.insteadOf=git@github.com: \
            submodule update --init --recursive --force
          test -f quicksafe/setup.py
          test -f quicksafe/instances/QuickSafe.py
          test -f quicksafe/targets/LibCalls.py
          test -f quicksafe/infra/infra/__init__.py
          git rev-parse HEAD | tee "$QS_LOGS/source-commit.txt"
          git submodule status --recursive | tee "$QS_LOGS/submodules.txt"
          find quicksafe/infra -maxdepth 3 \( -name 'requirements*.txt' -o -name 'pyproject.toml' -o -name 'setup.py' \) \
            -print | tee "$QS_LOGS/infra-dependency-files.txt"

      - name: 03b - Resolve compatible LLVM 16 toolchain
        id: llvm16
        run: |
          set -Eeuo pipefail
          echo 'QuickSafe pinned setup.py requests LLVM 16.0.6.'
          echo 'Checking available LLVM configurations (never substitute LLVM 18).'
          command -v llvm-config || true
          for bin in /usr/local/bin/llvm-config /usr/bin/llvm-config-16 /usr/lib/llvm-16/bin/llvm-config; do
            if [[ -x "$bin" ]]; then echo "$bin: $("$bin" --version)"; fi
          done
          candidate=''
          for bin in /usr/local/bin/llvm-config /usr/bin/llvm-config-16 /usr/lib/llvm-16/bin/llvm-config; do
            if [[ -x "$bin" ]] && [[ "$("$bin" --version)" == 16.* ]]; then
              candidate="$bin"
              break
            fi
          done
          if [[ -z "$candidate" ]]; then
            echo 'LLVM 16 not found. Checking Ubuntu package availability.'
            apt-cache policy llvm-16-dev | tee "$QS_LOGS/llvm16-apt-policy.txt"
            if apt-cache policy llvm-16-dev | grep -Eq 'Candidate: \(none\)'; then
              echo '::error::llvm-16-dev is unavailable from configured APT repositories. Install a compatible LLVM 16 toolchain before rerunning; LLVM 18 is not a safe replacement.'
              exit 1
            fi
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends llvm-16-dev clang-16 lld-16
            candidate=/usr/bin/llvm-config-16
          fi
          [[ -x "$candidate" ]] || { echo '::error::LLVM 16 llvm-config executable missing'; exit 1; }
          [[ "$("$candidate" --version)" == 16.* ]] || { echo '::error::Wrong LLVM version'; exit 1; }
          for flag in --includedir --obj-root --bindir --libdir; do
            dir="$("$candidate" "$flag")"
            [[ -d "$dir" ]] || { echo "::error::LLVM $flag directory does not exist: $dir"; exit 1; }
          done
          echo "QS_LLVM_CONFIG=$candidate" >> "$GITHUB_ENV"
          echo "Selected LLVM: $candidate ($("$candidate" --version))" | tee "$QS_LOGS/llvm16-selected.txt"
          # setup.py hardcodes /usr/local/bin/llvm-config; change only that
          # explicit path in this disposable checkout, not the system executable.
          export QS_LLVM_CONFIG="$candidate"
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          path = Path(os.environ['QS_ROOT']) / 'source/quicksafe/setup.py'
          original = path.read_text()
          old = 'llvm_config=Path("/usr/local/bin/llvm-config")'
          if original.count(old) != 1:
              raise SystemExit('Unexpected QuickSafe LLVM config declaration; refusing to patch')
          path.write_text(original.replace(old, f'llvm_config=Path("{os.environ["QS_LLVM_CONFIG"]}")'))
          print('Configured QuickSafe to use', os.environ['QS_LLVM_CONFIG'])
          PYCODE
          git -C "$QS_ROOT/source" diff -- quicksafe/setup.py | tee "$QS_LOGS/llvm16-setup-patch.diff"

      - name: 04 - Create fresh Python environment and verify imports
        id: python_setup
        run: |
          set -Eeuo pipefail
          # Per-run virtualenv prevents prior runs from masking missing dependencies.
          python3 -m venv "$QS_VENV"
          PYTHON="$QS_VENV/bin/python"
          INFRA="$QS_ROOT/source/quicksafe/infra"
          "$PYTHON" -m pip install --upgrade pip setuptools wheel
          # Confirmed missing in earlier CI traces; packaging used by tooling.
          "$PYTHON" -m pip install requests sympy packaging argcomplete coloredlogs
          if [[ -f "$INFRA/pyproject.toml" || -f "$INFRA/setup.py" ]]; then
            "$PYTHON" -m pip install -e "$INFRA"
          fi
          if [[ -f "$INFRA/requirements.txt" ]]; then
            "$PYTHON" -m pip install -r "$INFRA/requirements.txt"
          fi
          # Some pinned infra revisions refer to SPEC targets whose source files
          # are absent. Only guard missing SPEC target modules, never arbitrary imports.
          export QS_INFRA_TARGETS="$INFRA/infra/targets"
          "$PYTHON" - <<'PY' 2>&1 | tee "$QS_LOGS/optional-spec-targets-fix.log"
          from pathlib import Path
          import ast
          import os
          import re
          folder = Path(os.environ['QS_INFRA_TARGETS'])
          init = folder / '__init__.py'
          original = init.read_text()
          lines = original.splitlines(keepends=True)
          changed = []
          pattern = re.compile(r'^(\s*)from \.(spec[0-9A-Za-z_]*) import ([A-Za-z_][A-Za-z_0-9]*)(\s*(?:#.*)?)$')
          for i, line in enumerate(lines):
              match = pattern.match(line.rstrip('\r\n'))
              if not match:
                  continue
              indent, module, symbol, comment = match.groups()
              if (folder / (module + '.py')).is_file() or (folder / module / '__init__.py').is_file():
                  continue
              # Do not swallow import failures within a module that exists.
              lines[i] = (f'{indent}try:\n'
                          f'{indent}    from .{module} import {symbol}{comment}\n'
                          f'{indent}except ModuleNotFoundError as exc:\n'
                          f'{indent}    if exc.name != __package__ + ".{module}":\n'
                          f'{indent}        raise\n')
              changed.append(module)
          if changed:
              candidate = ''.join(lines)
              ast.parse(candidate, filename=str(init))
              init.write_text(candidate)
              print('Guarded absent optional SPEC modules:', ', '.join(changed))
          else:
              print('No absent SPEC target imports to guard')
          print('SPEC target files:', sorted(p.name for p in folder.glob('spec*')))
          print('Changed file:', init if changed else '(none)')
          PY
          "$PYTHON" -m pip check | tee "$QS_LOGS/pip-check.log"
          "$PYTHON" -m pip freeze | tee "$QS_LOGS/python-freeze.txt"
          cd "$QS_ROOT/source/quicksafe"
          "$PYTHON" - <<'PY' 2>&1 | tee "$QS_LOGS/import-preflight.log"
          import sys
          import requests
          import sympy
          import argcomplete
          import coloredlogs
          import infra
          from infra import Setup
          print('Python:', sys.version)
          print('requests:', requests.__version__)
          print('sympy:', sympy.__version__)
          print('argcomplete:', argcomplete.__file__)
          print('coloredlogs:', coloredlogs.__file__)
          print('infra:', infra.__file__)
          print('Setup:', Setup)
          print('QuickSafe Python imports: PASS')
          PY
          "$PYTHON" setup.py --help 2>&1 | tee "$QS_LOGS/setup-help.log"

      - name: 05 - Build QuickSafe instrumentation and LibCalls
        id: build
        if: steps.python_setup.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$QS_ROOT/source/quicksafe"
          export PATH="$QS_VENV/bin:$PATH"
          export CMAKE_BUILD_PARALLEL_LEVEL=1
          export MAKEFLAGS=-j1
          # Force a fresh target compile rather than reusing v18/v19 Ninja outputs.
          # Preserve downloaded sources and package caches for this low-memory runner.
          rm -rf build/targets/LibCalls/build build/targets/LibCalls/bin
          echo 'Building fresh QuickSafe instrumentation and LibCalls target.'
          python -u setup.py -j 1 build LibCalls QuickSafe 2>&1 | tee "$QS_LOGS/quicksafe-build.log"
          rc=${PIPESTATUS[0]}
          # This revision of infra.setup may print a traceback but exit zero.
          if grep -Eq 'Traceback \(most recent call last\):|^unknown error$|^FileNotFoundError:|^ModuleNotFoundError:|^ImportError:' "$QS_LOGS/quicksafe-build.log"; then
            echo '::error::Build printed an exception despite its process exit status'
            rc=1
          fi
          printf '%s\n' "$rc" > "$QS_LOGS/build.exit"
          exit "$rc"

      - name: 06 - Run QuickSafe-instrumented LibCalls
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$QS_ROOT/source/quicksafe"
          export PATH="$QS_VENV/bin:$PATH"
          python -u setup.py run LibCalls QuickSafe 2>&1 | tee "$QS_LOGS/quicksafe-libcalls-test.log"
          rc=${PIPESTATUS[0]}
          if grep -Eq 'Traceback \(most recent call last\):|^unknown error$|^FileNotFoundError:|^ModuleNotFoundError:|^ImportError:' "$QS_LOGS/quicksafe-libcalls-test.log"; then
            echo '::error::Test printed an exception despite its process exit status'
            rc=1
          fi
          printf '%s\n' "$rc" > "$QS_LOGS/test.exit"
          exit "$rc"

      - name: 06b - Locate QuickSafe runtime libraries and verify artifacts
        id: artifacts
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          cd "$QS_ROOT/source/quicksafe"
          BIN="$PWD/build/targets/LibCalls/bin/libcalls"
          PASS="$PWD/build/packages/QuickSafePass/install/lib/libQuickSafe.so"
          test -s "$BIN"
          test -x "$BIN"
          test -s "$PASS"
          file "$BIN" "$PASS" | tee "$QS_LOGS/artifact-types.log"
          file "$BIN" | grep -q 'ELF 64-bit'
          file "$PASS" | grep -q 'ELF 64-bit'
          readelf -h "$BIN" > "$QS_LOGS/libcalls-elf.log"
          # Discover both libraries in the same QuickSafe build/install tree.
          # Do not accept similarly named libraries from arbitrary system paths.
          RUNTIME_DIR=''
          while IFS= read -r -d '' lib; do
            dir="$(dirname "$lib")"
            if [[ -s "$dir/libQuicksafeRT.so" && -s "$dir/libQuickSafeHandlers.so" ]]; then
              RUNTIME_DIR="$dir"
              break
            fi
          done < <(find "$PWD/build/packages/QuickSafePass" -type f -name 'libQuicksafeRT.so' -print0)
          [[ -n "$RUNTIME_DIR" ]] || { echo '::error::QuickSafe runtime and handlers libraries not found together'; exit 1; }
          printf '%s\n' "$RUNTIME_DIR" | tee "$QS_LOGS/runtime-library-dir.txt"
          file "$RUNTIME_DIR/libQuicksafeRT.so" "$RUNTIME_DIR/libQuickSafeHandlers.so" | tee "$QS_LOGS/runtime-library-types.log"
          export LD_LIBRARY_PATH="$RUNTIME_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ldd "$BIN" | tee "$QS_LOGS/libcalls-ldd.log"
          ! grep -q 'not found' "$QS_LOGS/libcalls-ldd.log"
          for name in libQuicksafeRT.so libQuickSafeHandlers.so; do
            grep -F "$name => $RUNTIME_DIR/$name" "$QS_LOGS/libcalls-ldd.log"
          done
          grep -q 'Successfully built QuickSafePass!' "$QS_LOGS/quicksafe-build.log"
          grep -q 'Build of LibCalls finished (QuickSafe)' "$QS_LOGS/quicksafe-build.log"
          grep -q 'Run Build Command(s):' "$QS_LOGS/quicksafe-build.log"
          grep -q '\[1/2\]' "$QS_LOGS/quicksafe-build.log"
          grep -q 'Running QuickSafe on:' "$QS_LOGS/quicksafe-build.log"
          echo 'PASS: fresh compile, pass invocation, binary, plugin, and runtime libraries.'

      - name: 06c - Three independent LibCalls smoke tests
        id: smoke
        if: steps.test.outcome == 'success' && steps.artifacts.outcome == 'success'
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          BIN="$QS_ROOT/source/quicksafe/build/targets/LibCalls/bin/libcalls"
          RUNTIME_DIR="$(cat "$QS_LOGS/runtime-library-dir.txt")"
          [[ -s "$RUNTIME_DIR/libQuicksafeRT.so" && -s "$RUNTIME_DIR/libQuickSafeHandlers.so" ]]
          export LD_LIBRARY_PATH="$RUNTIME_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          for i in 1 2 3; do
            timeout 45s "$BIN" "quicksafe-smoke-$i" 2>&1 | tee "$QS_LOGS/smoke-$i.log"
            grep -q '^Got 2 arguments$' "$QS_LOGS/smoke-$i.log"
            grep -q "^Arg 1: quicksafe-smoke-$i$" "$QS_LOGS/smoke-$i.log"
            grep -q '^Random string:' "$QS_LOGS/smoke-$i.log"
            grep -q '^Second random string:' "$QS_LOGS/smoke-$i.log"
          done
          echo 'PASS: all three standalone smoke tests.'

      - name: 06d - Verify target selector and instrumentation evidence
        id: protection
        if: steps.artifacts.outcome == 'success' && steps.smoke.outcome == 'success'
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          cd "$QS_ROOT/source/quicksafe"
          echo "Selector supplied: $([[ -n "$VP_TARGETS_STR" ]] && echo yes || echo no)" | tee "$QS_LOGS/protection-evidence.log"
          # Inspect real source and compiled binary; these are evidence checks,
          # not substitutes for a demonstrated blocked memory violation.
          grep -RnE 'VP_TARGETS_STR|Parsing target string|No targets found' src include instances packages targets 2>/dev/null > "$QS_LOGS/target-parser-references.txt" || true
          test -s "$QS_LOGS/target-parser-references.txt" || echo 'Parser source not found in local checkout' >> "$QS_LOGS/protection-evidence.log"
          grep -q 'Running QuickSafe on:' "$QS_LOGS/quicksafe-build.log"
          grep -q 'Cloning handler functions IR to target module' "$QS_LOGS/quicksafe-build.log"
          if [[ -z "$VP_TARGETS_STR" ]]; then
            grep -Fq 'No targets found in $VP_TARGETS_STR; skipping...' "$QS_LOGS/quicksafe-build.log" || {
              echo '::error::Expected empty-selector control did not produce skip warning'; exit 1;
            }
            echo 'BASELINE PASS: empty selector is confirmed to skip protection. PROTECTION NOT VERIFIED.' | tee -a "$QS_LOGS/protection-evidence.log"
          else
            if grep -Fq 'No targets found in $VP_TARGETS_STR; skipping...' "$QS_LOGS/quicksafe-build.log"; then
              echo '::error::A selector was supplied but QuickSafe skipped target-specific instrumentation.'
              exit 1
            fi
            echo 'SELECTOR ACCEPTED: pass did not report empty targets; blocked-access behavior remains unverified.' | tee -a "$QS_LOGS/protection-evidence.log"
          fi
          # Confirm the expected QuickSafe runtime and handler exports exist.
          RT="$(cat "$QS_LOGS/runtime-library-dir.txt")/libQuicksafeRT.so"
          HANDLERS="$(cat "$QS_LOGS/runtime-library-dir.txt")/libQuickSafeHandlers.so"
          nm -D "$RT" > "$QS_LOGS/runtime-symbols.txt"
          nm -D "$HANDLERS" > "$QS_LOGS/handler-symbols.txt"
          grep -Eq 'guard_alloc|guard_dealloc|mprotect' "$QS_LOGS/runtime-symbols.txt" || {
            echo '::error::Expected runtime protection symbols missing'; exit 1;
          }
          echo 'PASS: pass activity, selector control, and runtime symbols checked.'

      - name: 06e - Deep target-specific memory protection experiment (verbose)
        id: deep_protection
        if: steps.protection.outcome == 'success' && steps.smoke.outcome == 'success'
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          cd "$QS_ROOT/source/quicksafe"
          export PATH="$QS_VENV/bin:$PATH"
          export CMAKE_BUILD_PARALLEL_LEVEL=1 MAKEFLAGS=-j1
          export LD_LIBRARY_PATH="$(cat "$QS_LOGS/runtime-library-dir.txt")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export VP_MEMOBJ_TYPE=HEAP
          mkdir -p "$QS_LOGS/deep-protection"
          D="$QS_LOGS/deep-protection"
          SRC="$PWD/build/targets/LibCalls/src/libcalls.cpp"
          BIN="$PWD/build/targets/LibCalls/bin/libcalls"
          cp "$SRC" "$D/original-libcalls.cpp"
          trap 'cp "$D/original-libcalls.cpp" "$SRC"' EXIT
          cat > "$SRC" <<'CPP'
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <new>
          // Deterministic heap allocation. Marker identifies exact selector line.
          __attribute__((noinline,optnone)) int exercise(bool invalid) {
              unsigned char *p = new unsigned char[32]; // QUICKSAFE_TARGET_ALLOC
              if (!p) return 20;
              for (int i=0;i<32;++i) p[i] = static_cast<unsigned char>(i);
              std::printf("NORMAL_ACCESS_OK checksum=%u\n", (unsigned)p[31]);
              std::fflush(stdout);
              if (invalid) {
                  std::puts("BEGIN_INTENTIONAL_OOB_WRITE");
                  std::fflush(stdout);
                  volatile unsigned char *vp = p;
                  vp[4096] = 0xA5; // deliberate invalid write, isolated subprocess only
                  std::puts("OOB_WRITE_RETURNED");
                  std::fflush(stdout);
              }
              delete[] p;
              return 0;
          }
          int main(int argc,char **argv) {
              return exercise(argc > 1 && std::strcmp(argv[1],"invalid") == 0);
          }
          CPP
          nl -ba "$SRC" | tee "$D/numbered-test-source.txt"
          line="$(grep -n 'QUICKSAFE_TARGET_ALLOC' "$SRC" | cut -d: -f1)"
          [[ "$line" =~ ^[0-9]+$ ]]
          export VP_TARGETS_STR="$(realpath "$SRC");;$line"
          printf 'VP_TARGETS_STR=%s\nVP_MEMOBJ_TYPE=%s\n' "$VP_TARGETS_STR" "$VP_MEMOBJ_TYPE" | tee "$D/selector.txt"
          echo '=== Building plain clang control ==='
          /usr/lib/llvm-16/bin/clang++ -O0 -g "$SRC" -o "$D/plain-control" 2>&1 | tee "$D/plain-compile.log"
          echo '=== Force fresh instrumented target rebuild ==='
          rm -rf build/targets/LibCalls/build build/targets/LibCalls/bin
          set +e
          python -u setup.py -j 1 build LibCalls QuickSafe > "$D/instrumented-build.log" 2>&1
          build_rc=$?
          set -e
          cat "$D/instrumented-build.log"
          printf '%s\n' "$build_rc" > "$D/build.exit"
          [[ "$build_rc" -eq 0 ]] || { echo '::error::Instrumented target build returned nonzero'; exit 1; }
          ! grep -Eq 'Traceback \(most recent call last\):|^FileNotFoundError:|^ModuleNotFoundError:' "$D/instrumented-build.log" || { echo '::error::Build traceback'; exit 1; }
          grep -Fq "$VP_TARGETS_STR" "$D/instrumented-build.log" || { echo '::error::Selector did not reach QuickSafe'; exit 1; }
          grep -q 'Parsed targeted source locations:' "$D/instrumented-build.log" || { echo '::error::Selector parsing not confirmed'; exit 1; }
          grep -Eq 'Found [1-9][0-9]* targeted heap alloc\(s\)' "$D/instrumented-build.log" || { echo '::error::No targeted heap allocation found'; exit 1; }
          grep -Eq 'Instrumenting [1-9][0-9]* targeted defsite\(s\)' "$D/instrumented-build.log" || { echo '::error::No target allocation instrumented'; exit 1; }
          grep -q 'Finished running QuickSafe on:' "$D/instrumented-build.log" || { echo '::error::QuickSafe pass did not finish'; exit 1; }
          [[ -x "$BIN" ]]
          echo '=== Symbol/ELF/runtime checks ==='
          file "$BIN" | tee "$D/instrumented-file.log"
          ldd "$BIN" | tee "$D/instrumented-ldd.log"
          nm -C "$BIN" > "$D/instrumented-nm.log" || true
          echo '=== Normal-access controls ==='
          timeout 20s "$D/plain-control" 2>&1 | tee "$D/plain-normal.log"
          timeout 20s "$BIN" 2>&1 | tee "$D/instrumented-normal.log"
          grep -q 'NORMAL_ACCESS_OK checksum=31' "$D/plain-normal.log"
          grep -q 'NORMAL_ACCESS_OK checksum=31' "$D/instrumented-normal.log"
          echo '=== Isolated invalid-access controls (never executed in runner shell) ==='
          ulimit -c 0
          set +e
          timeout 20s "$D/plain-control" invalid > "$D/plain-invalid.log" 2>&1
          plain_rc=$?
          timeout 20s "$BIN" invalid > "$D/instrumented-invalid.log" 2>&1
          protected_rc=$?
          set -e
          printf 'plain_invalid_exit=%s\ninstrumented_invalid_exit=%s\n' "$plain_rc" "$protected_rc" | tee "$D/invalid-exit-codes.txt"
          cat "$D/plain-invalid.log" "$D/instrumented-invalid.log"
          grep -q 'BEGIN_INTENTIONAL_OOB_WRITE' "$D/instrumented-invalid.log" || { echo '::error::Protected negative test did not reach invalid write'; exit 1; }
          {
            echo 'TARGET INSTRUMENTATION: VERIFIED (matching heap allocation and pass completion)'
            echo 'NORMAL PROTECTED ACCESS: VERIFIED'
            if [[ "$protected_rc" -eq 124 ]]; then
              echo 'NEGATIVE TEST: TIMEOUT; protection behavior inconclusive'
            elif [[ "$protected_rc" -ne 0 && "$plain_rc" -eq 0 ]]; then
              echo 'NEGATIVE TEST: instrumented-only failure; evidence of protection, but cause requires runtime/trace confirmation'
            elif [[ "$protected_rc" -ne 0 ]]; then
              echo 'NEGATIVE TEST: instrumented binary failed; baseline also failed, so attribution is inconclusive'
            else
              echo 'NEGATIVE TEST: invalid write returned normally; prevention NOT demonstrated'
            fi
            echo 'Do not equate a generic crash with QuickSafe-specific enforcement.'
          } | tee "$D/verdict.txt"
          cat "$D/verdict.txt" >> "$GITHUB_STEP_SUMMARY"
          [[ "$protected_rc" -ne 124 ]] || exit 1
          [[ "$protected_rc" -ne 0 && "$plain_rc" -eq 0 ]] || { echo '::error::Differential invalid-access prevention NOT demonstrated'; exit 1; }
          echo 'PASS: matched allocation instrumented, normal access succeeds, and differential invalid access fails.'

      - name: 06f - Broad protection coverage matrix (heap bounds and lifetime)
        id: broad_protection
        if: steps.deep_protection.outcome == 'success'
        run: |
          set -Eeuo pipefail
          cd "$QS_ROOT/source/quicksafe"
          export PATH="$QS_VENV/bin:$PATH"
          export CMAKE_BUILD_PARALLEL_LEVEL=1 MAKEFLAGS=-j1
          export LD_LIBRARY_PATH="$(cat "$QS_LOGS/runtime-library-dir.txt")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export VP_MEMOBJ_TYPE=HEAP
          D="$QS_LOGS/broad-protection"
          mkdir -p "$D"
          SRC="$PWD/build/targets/LibCalls/src/libcalls.cpp"
          BIN="$PWD/build/targets/LibCalls/bin/libcalls"
          cp "$SRC" "$D/original-libcalls.cpp"
          trap 'cp "$D/original-libcalls.cpp" "$SRC"' EXIT
          cat > "$SRC" <<'CPP'
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <new>
          __attribute__((noinline,optnone)) int probe(const char *mode, unsigned long offset) {
              unsigned char *p = new unsigned char[32]; // QUICKSAFE_BROAD_ALLOC
              for (int i=0; i<32; ++i) p[i] = static_cast<unsigned char>(i);
              std::printf("NORMAL_ACCESS_OK checksum=%u\n", (unsigned)p[31]);
              std::fflush(stdout);
              if (std::strcmp(mode,"normal") == 0) { delete[] p; return 0; }
              if (std::strcmp(mode,"oob") == 0) {
                  std::printf("ATTEMPT_OOB offset=%lu\n", offset); std::fflush(stdout);
                  volatile unsigned char *v = p;
                  v[offset] = 0xA5;
                  std::puts("INVALID_ACCESS_RETURNED"); std::fflush(stdout);
                  delete[] p;
                  return 0;
              }
              if (std::strcmp(mode,"uaf") == 0) {
                  delete[] p;
                  std::puts("ATTEMPT_USE_AFTER_FREE"); std::fflush(stdout);
                  volatile unsigned char *v = p;
                  v[0] = 0xA5;
                  std::puts("INVALID_ACCESS_RETURNED"); std::fflush(stdout);
                  return 0;
              }
              if (std::strcmp(mode,"doublefree") == 0) {
                  delete[] p;
                  std::puts("ATTEMPT_DOUBLE_FREE"); std::fflush(stdout);
                  delete[] p;
                  std::puts("INVALID_ACCESS_RETURNED"); std::fflush(stdout);
                  return 0;
              }
              delete[] p; return 50;
          }
          int main(int argc,char **argv) {
              const char *mode = argc > 1 ? argv[1] : "normal";
              unsigned long offset = argc > 2 ? std::strtoul(argv[2], nullptr, 10) : 0;
              return probe(mode, offset);
          }
          CPP
          nl -ba "$SRC" | tee "$D/numbered-source.txt"
          line="$(grep -n 'QUICKSAFE_BROAD_ALLOC' "$SRC" | cut -d: -f1)"
          export VP_TARGETS_STR="$(realpath "$SRC");;$line"
          printf 'VP_TARGETS_STR=%s\nVP_MEMOBJ_TYPE=%s\n' "$VP_TARGETS_STR" "$VP_MEMOBJ_TYPE" | tee "$D/selector.txt"
          /usr/lib/llvm-16/bin/clang++ -O0 -g "$SRC" -o "$D/plain-control" 2>&1 | tee "$D/plain-build.log"
          rm -rf build/targets/LibCalls/build build/targets/LibCalls/bin
          set +e
          python -u setup.py -j 1 build LibCalls QuickSafe > "$D/instrumented-build.log" 2>&1
          build_rc=$?
          set -e
          cat "$D/instrumented-build.log"
          [[ "$build_rc" -eq 0 ]] || { echo '::error::Broad matrix instrumented build failed'; exit 1; }
          grep -Fq "$VP_TARGETS_STR" "$D/instrumented-build.log"
          grep -Eq 'Found [1-9][0-9]* targeted heap alloc\(s\)' "$D/instrumented-build.log"
          grep -Eq 'Instrumenting [1-9][0-9]* targeted defsite\(s\)' "$D/instrumented-build.log"
          grep -q 'Finished running QuickSafe on:' "$D/instrumented-build.log"
          [[ -x "$BIN" ]]
          file "$BIN" | tee "$D/instrumented-file.log"
          ldd "$BIN" | tee "$D/instrumented-ldd.log"
          export QS_BROAD_BIN="$BIN" QS_BROAD_DIR="$D"
          python3 - <<'PYMATRIX'
          import csv, json, os, subprocess
          from pathlib import Path
          d = Path(os.environ['QS_BROAD_DIR'])
          binaries = {'plain': str(d/'plain-control'), 'protected': os.environ['QS_BROAD_BIN']}
          cases = [('normal',None)] + [('oob',n) for n in (32,33,40,48,63,64,96,128,256,512,1024,2048,4096,8192,16384)] + [('uaf',None),('doublefree',None)]
          records=[]
          for case, offset in cases:
              label = case if offset is None else f'{case}-{offset}'
              row={'case':case,'offset':offset,'label':label}
              for kind,binary in binaries.items():
                  args=[binary,case]+([str(offset)] if offset is not None else [])
                  try:
                      p=subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=15, text=True, errors='replace', cwd=d)
                      rc=p.returncode; out=p.stdout
                  except subprocess.TimeoutExpired as exc:
                      rc=124; out=(exc.stdout or b'').decode(errors='replace') if isinstance(exc.stdout,bytes) else (exc.stdout or '')
                  (d/f'{label}-{kind}.log').write_text(out)
                  row[kind+'_exit']=rc
                  row[kind+'_returned']='INVALID_ACCESS_RETURNED' in out
                  row[kind+'_quicksafe_handler']='[QuickSafeRT] Caught SIGSEGV' in out
                  row[kind+'_normal_ok']='NORMAL_ACCESS_OK checksum=31' in out
              if case=='normal':
                  verdict='PASS_NORMAL' if all(row[k+'_exit']==0 and row[k+'_normal_ok'] for k in binaries) else 'FAIL_NORMAL'
              elif row['protected_exit']==124 or row['plain_exit']==124:
                  verdict='INCONCLUSIVE_TIMEOUT'
              elif row['protected_quicksafe_handler'] and row['plain_exit']==0 and row['plain_returned']:
                  verdict='QUICKSAFE_INTERCEPTED_DIFFERENTIAL'
              elif row['protected_exit']!=0 and row['plain_exit']==0:
                  verdict='PROTECTED_ONLY_FAILURE_CAUSE_UNCONFIRMED'
              elif row['protected_exit']==0 and row['protected_returned']:
                  verdict='NOT_DETECTED_IN_THIS_RUN'
              else:
                  verdict='INCONCLUSIVE'
              row['verdict']=verdict
              records.append(row)
              print(f'{label:18} plain={row["plain_exit"]:4} protected={row["protected_exit"]:4} QS_handler={row["protected_quicksafe_handler"]} verdict={verdict}', flush=True)
          with (d/'matrix.csv').open('w',newline='') as f:
              writer=csv.DictWriter(f,fieldnames=list(records[0]));writer.writeheader();writer.writerows(records)
          (d/'matrix.json').write_text(json.dumps(records,indent=2)+'\n')
          detected=[r['label'] for r in records if r['verdict']=='QUICKSAFE_INTERCEPTED_DIFFERENTIAL']
          undetected=[r['label'] for r in records if r['verdict']=='NOT_DETECTED_IN_THIS_RUN']
          inconclusive=[r['label'] for r in records if 'INCONCLUSIVE' in r['verdict'] or 'UNCONFIRMED' in r['verdict']]
          summary=f"""# Broad QuickSafe heap protection matrix
          Cases executed: {len(records)} (normal, 15 out-of-bounds offsets, use-after-free, double-free)
          QuickSafe-specific differential interceptions: {len(detected)}: {', '.join(detected) or 'none'}
          Not detected in this run: {len(undetected)}: {', '.join(undetected) or 'none'}
          Inconclusive: {len(inconclusive)}: {', '.join(inconclusive) or 'none'}
          WARNING: No single test establishes universal bounds or lifetime protection. An exit code without QuickSafe handler evidence is not attributed to QuickSafe.
          """
          (d/'summary.txt').write_text(summary)
          print(summary)
          required=next(r for r in records if r['label']=='oob-4096')
          normal=records[0]
          if normal['verdict']!='PASS_NORMAL': raise SystemExit('Normal-access control failed')
          if required['verdict']!='QUICKSAFE_INTERCEPTED_DIFFERENTIAL': raise SystemExit('Previously demonstrated 4096-byte protection regression or attribution missing')
          PYMATRIX
          cat "$D/summary.txt" >> "$GITHUB_STEP_SUMMARY"
          echo 'PASS: broad matrix executed; normal control and previously verified 4096-byte QuickSafe interception retained.'

      - name: 06d - Report instrumentation coverage limitation
        id: coverage
        if: steps.build.outcome == 'success'
        run: |
          set -Eeuo pipefail
          if grep -Fq 'No targets found in $VP_TARGETS_STR; skipping...' "$QS_LOGS/quicksafe-build.log"; then
            echo 'BASELINE ONLY: unselected LibCalls build intentionally skipped target-specific protection; deep and broad experiments use separate explicit selectors.' | tee "$QS_LOGS/coverage.txt"
            echo '::warning::Unselected LibCalls baseline is not instrumented; inspect deep-protection and broad-protection results for verified targeted tests.'
          else
            echo 'QuickSafe pass ran during fresh build; target-specific coverage requires further validation.' | tee "$QS_LOGS/coverage.txt"
          fi

      - name: 07 - Print diagnostic report and precise failing stage
        if: always()
        run: |
          set +e
          echo '================ QUICKSAFE v23 REPORT ================'
          echo "Runner: $RUNNER_NAME"
          echo "LLVM 16: ${{ steps.llvm16.outcome }}"
          echo "Python setup: ${{ steps.python_setup.outcome }}"
          echo "Build: ${{ steps.build.outcome }}"
          echo "Test: ${{ steps.test.outcome }}"
          echo "Artifact checks: ${{ steps.artifacts.outcome }}"
          echo "Smoke tests: ${{ steps.smoke.outcome }}"
          echo "Protection evidence: ${{ steps.protection.outcome }}"
          echo "Deep protection: ${{ steps.deep_protection.outcome }}"
          echo "Broad protection: ${{ steps.broad_protection.outcome }}"
          for name in optional-spec-targets-fix.log import-preflight.log setup-help.log quicksafe-build.log quicksafe-libcalls-test.log libcalls-ldd.log runtime-library-dir.txt coverage.txt smoke-1.log smoke-2.log smoke-3.log protection-evidence.log target-parser-references.txt; do
            echo "--- $name (last 100 lines) ---"
            tail -100 "$QS_LOGS/$name" 2>/dev/null || true
          done
          free -h
          df -h "$QS_ROOT" || true
          {
            echo '# QuickSafe Oracle v23'
            echo "**Runner:** $RUNNER_NAME"
            echo "**LLVM 16:** ${{ steps.llvm16.outcome }}"
            echo "**Python setup:** ${{ steps.python_setup.outcome }}"
            echo "**Build:** ${{ steps.build.outcome }}"
            echo "**LibCalls test:** ${{ steps.test.outcome }}"
            echo "**Artifact checks:** ${{ steps.artifacts.outcome }}"
            echo "**Smoke tests:** ${{ steps.smoke.outcome }}"
            echo "**Protection evidence:** ${{ steps.protection.outcome }}"
            echo "**Deep protection:** ${{ steps.deep_protection.outcome }}"
            echo "**Broad protection:** ${{ steps.broad_protection.outcome }}"
            if [[ -f "$QS_LOGS/broad-protection/summary.txt" ]]; then cat "$QS_LOGS/broad-protection/summary.txt"; fi
            if [[ -f "$QS_LOGS/coverage.txt" ]]; then cat "$QS_LOGS/coverage.txt"; fi
            echo "**Logs:** $QS_LOGS"
            echo 'Build/test logs are checked for swallowed Python tracebacks as well as exit status.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 08 - Upload only this run's diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuickSafe-oracle-v23-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/ubuntu/quicksafe-work/ci-logs/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30

      - name: 09 - Enforce actual setup build and test success
        if: always()
        run: |
          set -Eeuo pipefail
          [[ "${{ steps.llvm16.outcome }}" == success ]] || { echo '::error::LLVM 16 setup failed; inspect Step 03b'; exit 1; }
          [[ "${{ steps.python_setup.outcome }}" == success ]] || { echo '::error::Python setup/import preflight failed; inspect Step 04'; exit 1; }
          [[ "${{ steps.build.outcome }}" == success ]] || { echo '::error::QuickSafe build failed or skipped; inspect Step 05'; exit 1; }
          [[ "${{ steps.test.outcome }}" == success ]] || { echo '::error::QuickSafe test failed or skipped; inspect Step 06'; exit 1; }
          test -f "$QS_LOGS/build.exit" || { echo '::error::Missing build exit status'; exit 1; }
          [[ "$(cat "$QS_LOGS/build.exit")" == 0 ]] || { echo '::error::Build returned nonzero'; exit 1; }
          test -f "$QS_LOGS/test.exit" || { echo '::error::Missing test exit status'; exit 1; }
          [[ "$(cat "$QS_LOGS/test.exit")" == 0 ]] || { echo '::error::Test returned nonzero'; exit 1; }
          [[ "${{ steps.artifacts.outcome }}" == success ]] || { echo '::error::Artifact checks failed'; exit 1; }
          [[ "${{ steps.smoke.outcome }}" == success ]] || { echo '::error::Smoke tests failed'; exit 1; }
          [[ "${{ steps.protection.outcome }}" == success ]] || { echo '::error::Protection evidence checks failed'; exit 1; }
          [[ "${{ steps.deep_protection.outcome }}" == success ]] || { echo '::error::Deep protection experiment failed; inspect deep-protection diagnostics'; exit 1; }
          [[ "${{ steps.broad_protection.outcome }}" == success ]] || { echo '::error::Broad protection matrix failed; inspect broad-protection diagnostics'; exit 1; }
          [[ "${{ steps.coverage.outcome }}" == success ]] || { echo '::error::Coverage classification failed'; exit 1; }
          echo 'PASS: QuickSafe build, LibCalls execution, artifacts and three smoke tests.'
          echo 'Deep and broad protection experiments completed; inspect both reports for per-case evidence and limits.'
