name: QuickSafe real-handler regression
on:
  workflow_dispatch:
  push:
    paths:
      - '**/Handlers.cpp'
      - '**/guard.cpp'
      - '.github/workflows/quicksafe-security-matrix.yml'
  pull_request:
    paths:
      - '**/Handlers.cpp'
      - '**/guard.cpp'
      - '.github/workflows/quicksafe-security-matrix.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-16 llvm-16-dev libclang-16-dev lld-16 cmake ninja-build ccache pkg-config libxml2-dev libzstd-dev zlib1g-dev libunwind-dev python3
      - name: Detect actual source root and record source evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          pwd | tee evidence/pwd.txt
          find . -maxdepth 5 -name Handlers.cpp -print | tee evidence/source-locations.txt
          mapfile -t candidates < <(find . -maxdepth 5 -path '*/src/Handlers.cpp' -print)
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one QuickSafe src/Handlers.cpp; found ${#candidates[@]}" >&2
            exit 1
          fi
          src="${candidates[0]%/src/Handlers.cpp}"
          test -f "$src/CMakeLists.txt"
          test -f "$src/external/QuicksafeRT/src/guard.cpp"
          printf 'QS_SOURCE=%s\n' "$src" >> "$GITHUB_ENV"
          sha256sum "$src/src/Handlers.cpp" "$src/external/QuicksafeRT/src/guard.cpp" | tee evidence/source-hashes.txt
          sed -n '/void \*__vp_handle_realloc_target(/,/^}/p' "$src/src/Handlers.cpp" > evidence/realloc-implementation.txt
          sed -n '/void \*__vp_handle_reallocarray_target(/,/^}/p' "$src/src/Handlers.cpp" > evidence/reallocarray-implementation.txt
      - name: Configure and build original libraries
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$QS_SOURCE" -B "$RUNNER_TEMP/qs-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-16 -DCMAKE_CXX_COMPILER=clang++-16 \
            -DLLVM_DIR=/usr/lib/llvm-16/lib/cmake/llvm \
            2>&1 | tee evidence/configure.log
          cmake --build "$RUNNER_TEMP/qs-build" --target QuickSafeHandlers --parallel 2 2>&1 | tee evidence/build.log
          find "$RUNNER_TEMP/qs-build" -type f \( -name 'libQuickSafeHandlers.so' -o -name 'libQuicksafeRT.so' \) | tee evidence/libraries.txt
      - name: Create direct real-handler tests
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/qs-test.cpp" <<'CPP'
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <cstdint>
          #include <cerrno>
          #include <malloc.h>
          #include <string>
          extern "C" {
            void* __vp_handle_realloc_target(void*, size_t);
            void* __vp_handle_reallocarray_target(void*, size_t, size_t);
            void* __vp_handle_reallocarray(void*, size_t, size_t);
            void* __vp_handle_malloc_target(size_t);
            void __vp_handle_free(void*);
          }
          int main(int argc, char** argv) {
            if (argc != 2) return 2;
            std::string t(argv[1]);
            if (t == "libc_control_overflow") {
              void* p = malloc(32); if (!p) return 3;
              errno = 0;
              void* q = __vp_handle_reallocarray(p, SIZE_MAX / 16 + 1, 16);
              if (q) { __vp_handle_free(q); return 5; }
              if (errno != ENOMEM) { free(p); return 6; }
              memset(p, 0x42, 32); free(p);
              puts("CONTROL_PASS: rejected overflow and preserved allocation");
              return 0;
            }
            if (t == "guarded_shrink" || t == "guarded_overflow") {
              void* p = __vp_handle_malloc_target(128); if (!p) return 4;
              memset(p, 0x41, 128);
              void* q = t == "guarded_shrink"
                ? __vp_handle_realloc_target(p, 8)
                : __vp_handle_reallocarray_target(p, SIZE_MAX / 16 + 1, 16);
              fprintf(stderr, "handler returned %p\n", q);
              if (q) __vp_handle_free(q);
              return 0; // No crash is inconclusive.
            }
            size_t old = 128;
            if (t == "shrink_4096_1") old = 4096;
            if (t == "padding_17_16") old = 17;
            void* p = malloc(old); if (!p) return 3;
            memset(p, 0x41, old);
            fprintf(stderr, "requested=%zu usable=%zu\n", old, malloc_usable_size(p));
            void* q = nullptr;
            if (t == "shrink_128_8") q = __vp_handle_realloc_target(p, 8);
            else if (t == "shrink_4096_1") q = __vp_handle_realloc_target(p, 1);
            else if (t == "padding_17_16") q = __vp_handle_realloc_target(p, 16);
            else if (t == "array_shrink") q = __vp_handle_reallocarray_target(p, 1, 8);
            else if (t == "array_overflow_zero") q = __vp_handle_reallocarray_target(p, SIZE_MAX / 16 + 1, 16);
            else if (t == "array_overflow_small") q = __vp_handle_reallocarray_target(p, SIZE_MAX / 16 + 2, 16);
            else if (t == "null_realloc") { free(p); q = __vp_handle_realloc_target(nullptr, 32); }
            else if (t == "zero_realloc") q = __vp_handle_realloc_target(p, 0);
            else if (t == "grow") q = __vp_handle_realloc_target(p, 256);
            else { free(p); return 2; }
            fprintf(stderr, "handler returned %p\n", q);
            if (q) __vp_handle_free(q);
            return 0; // Explicitly inconclusive unless external detector reports fault.
          }
          CPP
      - name: Link actual handler and runtime
        shell: bash
        run: |
          set -euo pipefail
          handlers="$(find "$RUNNER_TEMP/qs-build" -type f -name libQuickSafeHandlers.so -print -quit)"
          runtime="$(find "$RUNNER_TEMP/qs-build" -type f -name libQuicksafeRT.so -print -quit)"
          test -n "$handlers" && test -n "$runtime"
          clang++-16 -std=c++20 -O0 -g "$RUNNER_TEMP/qs-test.cpp" "$handlers" \
            -Wl,-rpath,"$(dirname "$handlers")" \
            -Wl,-rpath,"$(dirname "$runtime")" \
            -o "$RUNNER_TEMP/qs-test"
          ldd "$RUNNER_TEMP/qs-test" | tee evidence/linkage.txt
          ! grep -q 'not found' evidence/linkage.txt
          nm -D "$handlers" | grep '__vp_handle_realloc' | tee evidence/handler-symbols.txt
      - name: Run each case independently and retain outcomes
        shell: bash
        run: |
          set -uo pipefail
          ulimit -c 0
          echo 'case,exit,status' > evidence/results.csv
          for t in libc_control_overflow shrink_128_8 shrink_4096_1 padding_17_16 array_shrink array_overflow_zero array_overflow_small guarded_shrink guarded_overflow null_realloc zero_realloc grow; do
            echo "==== $t ===="
            timeout 15s "$RUNNER_TEMP/qs-test" "$t" > "evidence/$t.log" 2>&1
            rc=$?
            if [ "$rc" -eq 124 ]; then status=TIMEOUT
            elif [ "$rc" -ge 128 ]; then status=FAULT_OR_SIGNAL
            elif [ "$rc" -eq 0 ] && [ "$t" = libc_control_overflow ]; then status=CONTROL_PASS
            elif [ "$rc" -eq 0 ]; then status=INCONCLUSIVE
            else status=NONZERO_EXIT
            fi
            printf '%s,%s,%s\n' "$t" "$rc" "$status" | tee -a evidence/results.csv
            cat "evidence/$t.log"
          done
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '## QuickSafe original-code regression' >> "$GITHUB_STEP_SUMMARY"
          if [ -f evidence/results.csv ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat evidence/results.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Build or setup failed before runtime testing.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Exit 0 for a target handler is inconclusive; no memory-boundary oracle is installed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quicksafe-real-handler-evidence
          path: evidence/
          if-no-files-found: warn
