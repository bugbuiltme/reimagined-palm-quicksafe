name: QuickSafe original handler crash boundary regression
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/quicksafe-two-defects.yml'
      - '**/Handlers.cpp'
      - '**/guard.cpp'
      - '**/*quicksafe*.zip'
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        detect_mode: [OVERFLOW, UNDERFLOW]
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-16 llvm-16-dev libclang-16-dev lld-16 cmake ninja-build ccache pkg-config libxml2-dev libzstd-dev zlib1g-dev libunwind-dev python3 gdb binutils
          mkdir -p "$EVIDENCE"
          uname -a | tee "$EVIDENCE/platform.txt"
      - name: Checkout upstream VUSec QuickSafe (real source)
        uses: actions/checkout@v4
        with:
          repository: vusec/QuickSafe
          ref: master
          path: upstream-quicksafe
          submodules: recursive
          persist-credentials: false

      - name: Validate upstream checkout and record provenance
        shell: bash
        run: |
          set -euo pipefail
          QS_SOURCE="$GITHUB_WORKSPACE/upstream-quicksafe/quicksafe"
          echo "QS_SOURCE=$QS_SOURCE" >> "$GITHUB_ENV"
          echo "Upstream revision:"
          git -C "$GITHUB_WORKSPACE/upstream-quicksafe" rev-parse HEAD | tee "$EVIDENCE/upstream-commit.txt"
          git -C "$GITHUB_WORKSPACE/upstream-quicksafe" submodule status --recursive | tee "$EVIDENCE/submodules.txt"
          echo "Checkout tree:"
          find "$GITHUB_WORKSPACE/upstream-quicksafe/quicksafe" -maxdepth 3 -type f -print > "$EVIDENCE/tree-all.txt"
          sed -n "1,100p" "$EVIDENCE/tree-all.txt" | tee "$EVIDENCE/tree.txt"
          for required in CMakeLists.txt src/Handlers.cpp external/QuicksafeRT/src/guard.cpp; do
            if [ ! -f "$QS_SOURCE/$required" ]; then
              echo "::error::Missing upstream file: $QS_SOURCE/$required"
              exit 1
            fi
          done
          sha256sum "$QS_SOURCE/src/Handlers.cpp" "$QS_SOURCE/external/QuicksafeRT/src/guard.cpp" | tee "$EVIDENCE/source-sha256.txt"

      - name: Preserve source and inspect exact statements
        run: |
          set -euo pipefail
          sha256sum "$QS_SOURCE/src/Handlers.cpp" "$QS_SOURCE/external/QuicksafeRT/src/guard.cpp" | tee "$EVIDENCE/source-sha256.txt"
          nl -ba "$QS_SOURCE/src/Handlers.cpp" | sed -n '155,225p' | tee "$EVIDENCE/handler-source.txt"
          grep -nE 'guard_alloc\(|guard_realloc\(|is_guard_addr\(' "$QS_SOURCE/external/QuicksafeRT/src/guard.cpp" > "$EVIDENCE/allocator-locations-all.txt" || true
          sed -n "1,60p" "$EVIDENCE/allocator-locations-all.txt" | tee "$EVIDENCE/allocator-locations.txt"
      - name: Configure and build original libraries
        run: |
          set -euo pipefail
          cmake -S "$QS_SOURCE" -B "$RUNNER_TEMP/qs-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-16 -DCMAKE_CXX_COMPILER=clang++-16 \
            -DLLVM_DIR=/usr/lib/llvm-16/lib/cmake/llvm \
            -DQUICKSAFE_USE_MTE=OFF -DQUICKSAFE_DETECT_MODE=${{ matrix.detect_mode }} \
            2>&1 | tee "$EVIDENCE/configure.log"
          cmake --build "$RUNNER_TEMP/qs-build" --target QuickSafeHandlers --parallel 2 2>&1 | tee "$EVIDENCE/build.log"
          find "$RUNNER_TEMP/qs-build" -name '*.so' -print | tee "$EVIDENCE/libraries.txt"
      - name: Generate direct-call regression harness
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/two_cases.cpp" <<'CPP'
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <cstdint>
          #include <cerrno>
          #include <malloc.h>
          #include <limits>
          #include <unistd.h>
          extern "C" void* __vp_handle_realloc_target(void*,size_t);
          extern "C" void* __vp_handle_reallocarray_target(void*,size_t,size_t);
          extern "C" void* __vp_handle_reallocarray(void*,size_t,size_t);
          extern "C" void __vp_handle_free(void*);
          int main(int argc,char**argv) {
            setvbuf(stderr,nullptr,_IONBF,0);
            if(argc!=2) return 90;
            const char* mode=argv[1];
            size_t old_requested=128;
            size_t new_requested=8;
            bool shrink_case=false, array_case=false, positive_wrap=false;
            if (sscanf(mode,"shrink_%zu_to_%zu",&old_requested,&new_requested)==2) shrink_case=true;
            else if (sscanf(mode,"array_overflow_zero_%zu",&old_requested)==1) array_case=true;
            else if (sscanf(mode,"array_overflow_positive_%zu",&old_requested)==1) {array_case=true;positive_wrap=true;}
            if(old_requested > 1024*1024 || new_requested > 1024*1024) return 93;
            long page_size=sysconf(_SC_PAGESIZE);
            fprintf(stderr,"PAGE_SIZE=%ld\n",page_size);
            void* p=malloc(old_requested);
            if(!p) return 91;
            memset(p,0x5a,old_requested);
            const size_t usable=malloc_usable_size(p);
            fprintf(stderr,"CASE=%s old_requested=%zu old_usable=%zu old_ptr=%p\n",mode,old_requested,usable,p);
            void* q=nullptr;
            errno=0;
            if(shrink_case) {
              fprintf(stderr,"CALL original __vp_handle_realloc_target(p,%zu); copy_len=%zu; requested_destination=%zu\n",new_requested,usable,new_requested);
              q=__vp_handle_realloc_target(p,new_requested);
            } else if(array_case) {
              size_t count=std::numeric_limits<size_t>::max()/16+(positive_wrap?2:1);
              size_t element_size=16;
              fprintf(stderr,"CALL original __vp_handle_reallocarray_target(p,%zu,%zu); wrapped_size=%zu\n",count,element_size,count*element_size);
              q=__vp_handle_reallocarray_target(p,count,element_size);
            } else if(strcmp(mode,"control_grow")==0) {
              fprintf(stderr,"CALL original __vp_handle_realloc_target(p,256)\n");
              q=__vp_handle_realloc_target(p,256);
            } else if(strcmp(mode,"control_libc_overflow")==0) {
              size_t count=std::numeric_limits<size_t>::max()/16+1;
              fprintf(stderr,"CALL original __vp_handle_reallocarray(p,%zu,16)\n",count);
              q=__vp_handle_reallocarray(p,count,16);
              fprintf(stderr,"RETURN q=%p errno=%d (expected null and ENOMEM=%d)\n",q,errno,ENOMEM);
              if(q) { __vp_handle_free(q); return 11; }
              if(errno!=ENOMEM) { free(p); return 12; }
              for(size_t i=0;i<old_requested;i++) if(((unsigned char*)p)[i]!=0x5a) {free(p);return 13;}
              free(p);
              return 0;
            } else { free(p);return 92; }
            fprintf(stderr,"RETURN q=%p errno=%d\n",q,errno);
            // Never use libc free on a QuickSafe guarded allocation.
            // For a null return, original ownership may be ambiguous: avoid cleanup here.
            // No return code establishes memory safety without an independent oracle.
            return q?0:20;
          }
          CPP
          HANDLERS="$(find "$RUNNER_TEMP/qs-build" -name 'libQuickSafeHandlers.so' -print -quit)"
          test -n "$HANDLERS"
          clang++-16 -std=c++20 -O0 -g -fno-omit-frame-pointer -fno-builtin-memcpy \
            "$RUNNER_TEMP/two_cases.cpp" "$HANDLERS" \
            -Wl,-rpath,"$(dirname "$HANDLERS")" \
            -o "$RUNNER_TEMP/two_cases"
          RUNTIME_LIB="$(find "$RUNNER_TEMP/qs-build" -name "libQuicksafeRT.so" -print -quit)"
          test -n "$RUNTIME_LIB"
          export LD_LIBRARY_PATH="$(dirname "$HANDLERS"):$(dirname "$RUNTIME_LIB"):${LD_LIBRARY_PATH:-}"
          ldd "$RUNNER_TEMP/two_cases" | tee "$EVIDENCE/ldd.txt"
          if grep -q 'not found' "$EVIDENCE/ldd.txt"; then exit 1; fi
          nm -D "$HANDLERS" | grep -E '__vp_handle_realloc(array)?_target' | tee "$EVIDENCE/symbols.txt"
          cp "$RUNNER_TEMP/two_cases.cpp" "$EVIDENCE/harness.cpp"
      - name: Execute isolated cases with backtraces and structured verdicts
        shell: bash
        run: |
          set -uo pipefail
          ulimit -c 0
          export QS_BINARY="$RUNNER_TEMP/two_cases"
          HANDLERS="$(find "$RUNNER_TEMP/qs-build" -name "libQuickSafeHandlers.so" -print -quit)"
          RUNTIME_LIB="$(find "$RUNNER_TEMP/qs-build" -name "libQuicksafeRT.so" -print -quit)"
          export LD_LIBRARY_PATH="$(dirname "$HANDLERS"):$(dirname "$RUNTIME_LIB"):${LD_LIBRARY_PATH:-}"
          python3 - <<'PY'
          import os, subprocess, pathlib, json, signal, time
          out=pathlib.Path(os.environ['EVIDENCE'])
          binary=os.environ['QS_BINARY']
          sizes=[128,4095,4096,4097,8192,16384,65536]
          names=['control_grow','control_libc_overflow']
          names += [f'shrink_{n}_to_8' for n in sizes]
          names += [f'array_overflow_zero_{n}' for n in sizes]
          names += [f'array_overflow_positive_{n}' for n in sizes]
          records=[]
          for name in names:
              print('\n'+'='*75+'\n'+name,flush=True)
              started=time.monotonic()
              try:
                  p=subprocess.run([binary,name],capture_output=True,text=True,errors='replace',timeout=20)
                  rc=p.returncode; log=p.stdout+p.stderr; timed_out=False
              except subprocess.TimeoutExpired as e:
                  rc=124;timed_out=True
                  def decode(v):return v.decode(errors='replace') if isinstance(v,bytes) else (v or '')
                  log=decode(e.stdout)+decode(e.stderr)
              (out/(name+'.log')).write_text(log)
              print(log[-12000:],flush=True)
              if timed_out: classification='TIMEOUT_INCONCLUSIVE'
              elif rc<0: classification='SIGNAL_'+signal.Signals(-rc).name
              elif rc==0: classification='RETURNED_NO_MEMORY_SAFETY_PROOF'
              else: classification='NONZERO_EXIT_'+str(rc)
              if name=='control_libc_overflow' and rc==0: classification='CONTROL_REJECTED_OVERFLOW_AND_PRESERVED_SOURCE'
              record={'case':name,'exit_code':rc,'classification':classification,'elapsed_seconds':round(time.monotonic()-started,3)}
              records.append(record)
              print(json.dumps(record),flush=True)
              # Obtain a second-run debugger backtrace; it is not guaranteed to reproduce.
              if name.startswith(('shrink_','array_overflow_')) and (rc < 0 or rc != 0 or name.endswith(('16384','65536')) or name.startswith(('shrink_16384','shrink_65536'))):
                  cmd=['gdb','-q','-batch','-ex','set pagination off','-ex','set print thread-events off','-ex','run','-ex','bt full','-ex','info registers','--args',binary,name]
                  try:
                      d=subprocess.run(cmd,capture_output=True,text=True,errors='replace',timeout=35)
                      (out/(name+'.gdb.txt')).write_text(d.stdout+'\n'+d.stderr)
                  except subprocess.TimeoutExpired as e:
                      (out/(name+'.gdb.txt')).write_text('Debugger timeout; inspect primary run\n')
          (out/'results.json').write_text(json.dumps(records,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## QuickSafe real handler results (${{ matrix.detect_mode }})\n\n')
              f.write('| Case | Exit | Classification |\n|---|---:|---|\n')
              for r in records:f.write(f"| {r['case']} | {r['exit_code']} | {r['classification']} |\n")
              f.write('\nThese tests use the unchanged upstream handlers and runtime. A signal alone does not prove an out-of-bounds write; inspect `.gdb.txt` for the faulting instruction and `memcpy` stack. Normal return does not prove safety.\n')
          PY
      - name: Upload all diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quicksafe-two-defects-${{ matrix.detect_mode }}
          path: evidence/
          if-no-files-found: warn
